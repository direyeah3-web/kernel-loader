name: Build KernelSU Module ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create KernelSU Module Structure
        run: |
          mkdir -p ksu_module/META-INF/com/google/android
          mkdir -p ksu_module/system/bin

          # 1. module.prop (Macluumaadka Module-ka)
          cat << 'END' > ksu_module/module.prop
          id=dire-ksu-loader
          name=Dire KernelSU Loader
          version=v1.0
          versionCode=1
          author=Dire
          description=Custom KernelSU Module for Samsung Galaxy A16
          END

          # 2. customize.sh (Halka uu ka fuliyo amarrada marka la flash-gareeyo)
          cat << 'END' > ksu_module/customize.sh
          ui_print("********************************")
          ui_print("   Dire KernelSU Module Install ")
          ui_print("********************************")
          set_perm_recursive $MODPATH/system/bin 0 0 0755 0755
          ui_print("Installation finished successfully!")
          END

          # 3. updater-script (Zipped flash requirement)
          echo "#" > ksu_module/META-INF/com/google/android/updater-script

          # 4. update-binary (Placeholder oo u oggolaanaya inuu si sax ah u flash-garoobo)
          cat << 'END' > ksu_module/META-INF/com/google/android/update-binary
          #!/sbin/sh
          exit 0
          END
          chmod +x ksu_module/META-INF/com/google/android/update-binary

          # Xirxiro oo ka dhig ZIP
          cd ksu_module
          zip -r9 ../dire-kernelsu-module.zip *
          cd ..

      - name: Upload KernelSU Module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-module-zip
          path: dire-kernelsu-module.zip
